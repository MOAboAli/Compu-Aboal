name: Restrict main merges

on:
  pull_request:
    branches:
      - main

jobs:
  only-from-develop:
    name: Source must be develop
    runs-on: ubuntu-latest
    steps:
      - name: Verify pull request source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "Only the develop branch can be merged into main (got: $HEAD_REF)."
            exit 1
          fi
          echo "Source branch is develop. OK."
