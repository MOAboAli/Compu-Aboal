services:
  backend:
    build: ./backend
    container_name: compu-aboali-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:-compu-aboali-dev-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AUTO_SEED: ${AUTO_SEED:-true}
    # Only reachable on the server itself (nginx uses Docker network name "backend")
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: compu-aboali-frontend
    restart: unless-stopped
    ports:
      # http://SERVER_IP  (no :3000)
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
